name: Build
concurrency:
  group: build
  cancel-in-progress: true
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: src, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v4
        with: {packages: "", accept-android-sdk-licenses: true, log-accepted-android-sdk-licenses: false}
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Build plugins
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TMDB_PRIMARY_API_KEY: ${{ secrets.TMDB_PRIMARY_API_KEY }}
          TMDB_PRIMARY_ACCESS_TOKEN: ${{ secrets.TMDB_PRIMARY_ACCESS_TOKEN }}
          TMDB_SECONDARY_API_KEY: ${{ secrets.TMDB_SECONDARY_API_KEY }}
          TMDB_SECONDARY_ACCESS_TOKEN: ${{ secrets.TMDB_SECONDARY_ACCESS_TOKEN }}
          TMDB_TERTIARY_API_KEY: ${{ secrets.TMDB_TERTIARY_API_KEY }}
          TMDB_TERTIARY_ACCESS_TOKEN: ${{ secrets.TMDB_TERTIARY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          gradle make makePluginsJson --no-daemon
      - name: Prepare build output
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/src"; OUT="$GITHUB_WORKSPACE/build-output"
          rm -rf "$OUT"; mkdir -p "$OUT"
          test -f "$SRC/build/plugins.json"
          find "$SRC" -type f -name "*.cs3" -not -path "$SRC/MovieBox/MovieBox_NoSupportAd_v52.cs3" -exec cp -f -t "$OUT" {} +
          if [ -f "$SRC/MovieBox/MovieBox_NoSupportAd_v52.cs3" ]; then cp -f "$SRC/MovieBox/MovieBox_NoSupportAd_v52.cs3" "$OUT/MovieBox.cs3"
          elif [ -f "$SRC/MovieBox/MovieBoxPrebuilt.cs3" ]; then cp -f "$SRC/MovieBox/MovieBoxPrebuilt.cs3" "$OUT/MovieBox.cs3"
          elif [ -f "$SRC/MovieBox/prebuilt/MovieBox_NoSupportAd_v52.cs3" ]; then cp -f "$SRC/MovieBox/prebuilt/MovieBox_NoSupportAd_v52.cs3" "$OUT/MovieBox.cs3"
          elif [ -f "$SRC/MovieBox/prebuilt/MovieBoxPrebuilt.cs3" ]; then cp -f "$SRC/MovieBox/prebuilt/MovieBoxPrebuilt.cs3" "$OUT/MovieBox.cs3"
          else echo "ERROR: MovieBox runtime file is missing"; exit 1; fi
          while IFS= read -r jar; do
            provider="$(basename "$(dirname "$(dirname "$jar")")")"
            case "$provider" in build|src|MovieBox) continue;; esac
            cp -f "$jar" "$OUT/$provider.jar"
          done < <(find "$SRC" -type f -path "*/build/libs/*.jar" | sort)
          cp -f "$SRC/build/plugins.json" "$OUT/plugins.json"
          printf '%s\n' '{' '  "name": "MovieCloud",' '  "description": "MovieCloud CloudStream Extensions",' '  "manifestVersion": 1,' '  "pluginLists": [' "    \"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json\"" '  ]' '}' > "$OUT/repo.json"
          MOVIEBOX_HASH="sha256-$(sha256sum "$OUT/MovieBox.cs3" | cut -d" " -f1)"
          MOVIEBOX_SIZE="$(wc -c < "$OUT/MovieBox.cs3" | tr -d " ")"
          MOVIEBOX_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/MovieBox.cs3"
          jq --arg hash "$MOVIEBOX_HASH" --arg url "$MOVIEBOX_URL" --argjson size "$MOVIEBOX_SIZE" 'map(select((.internalName // "") != "MovieBox" and (.internalName // "") != "MovieBoxProvider" and (.internalName // "") != "MovieBoxProviderIN")) + [{"iconUrl":"https://github.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/raw/refs/heads/master/Logos/MovieBoxProvider/icon.png","fileHash":$hash,"apiVersion":1,"repositoryUrl":("https://github.com/"+env.GITHUB_REPOSITORY),"fileSize":$size,"status":1,"language":"hi","authors":["NivinCNC","MovieCloud"],"tvTypes":["Movie","TvSeries"],"version":52,"internalName":"MovieBox","description":"Multi Language Movies and Series Provider","url":$url,"name":"MovieBox"}]' "$OUT/plugins.json" > "$OUT/plugins.json.tmp"
          mv "$OUT/plugins.json.tmp" "$OUT/plugins.json"
          python3 - "$OUT" > "$OUT/artifact-index.json" <<'PY'
          import json, os, sys
          out=sys.argv[1]; files=sorted(os.listdir(out)); providers={}
          for name in files:
              if name.endswith(".cs3") or name.endswith(".jar"):
                  stem, ext=os.path.splitext(name); providers.setdefault(stem,{})[ext[1:]]=name
          print(json.dumps({"version":1,"files":files,"providers":providers},separators=(",",":")))
          PY
          test -f "$OUT/artifact-index.json"
      - name: Prepare builds branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"; rm -rf builds
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
          cd builds; git fetch origin builds || true
          if git show-ref --verify --quiet refs/remotes/origin/builds; then git checkout -B builds origin/builds; git rm -rf . || true; git clean -fdx
          else git checkout --orphan builds; git rm -rf . || true; git clean -fdx; fi
      - name: Publish builds
        run: |
          set -euo pipefail
          cp -f "$GITHUB_WORKSPACE/build-output/"* "$GITHUB_WORKSPACE/builds/"
          cd "$GITHUB_WORKSPACE/builds"
          test -f repo.json; test -f plugins.json; test -f MovieBox.cs3; test -f artifact-index.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -m "Build ${{ github.sha }}" || echo "No changes to commit"
          git push origin builds --force